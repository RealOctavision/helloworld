   <g id="text_2">
    <text style="font-weight: 700; font-size: 26px; font-family: 'Apple SD Gothic Neo', 'DejaVu Sans'; text-anchor: start; fill: #193744" x="46.8" y="75.573594" transform="rotate(-0 46.8 75.573594)">학습 후보는 정리하고, 평가는 자연 빈도를 유지한다</text>
