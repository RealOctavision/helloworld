   <g id="text_1">
    <text style="font-size: 10.5px; font-family: 'Apple SD Gothic Neo', 'DejaVu Sans'; text-anchor: start; fill: #5b707a" x="50.4" y="27.435" transform="rotate(-0 50.4 27.435)">05  /  CAPSTONE · QUIC TRAFFIC CLASSIFICATION</text>
   </g>
   <g id="text_2">
    <text style="font-weight: 700; font-size: 26px; font-family: 'Apple SD Gothic Neo', 'DejaVu Sans'; text-anchor: start; fill: #193744" x="46.8" y="75.573594" transform="rotate(-0 46.8 75.573594)">교사의 확률 분포로 학생을 학습하고, 추론은 학생만 한다</text>
   </g>
   <g id="text_3">
    <text style="font-size: 13px; font-family: 'Apple SD Gothic Neo', 'DejaVu Sans'; text-anchor: start; fill: #5b707a" x="48.24" y="109.171406" transform="rotate(-0 48.24 109.171406)">M4의 교사는 M1 · M5의 교사는 M2 · 같은 구성·예산·seed의 교사를 연결</text>
   </g>
   <g id="text_4">
    <text style="font-size: 10.5px; font-family: 'Apple SD Gothic Neo', 'DejaVu Sans'; text-anchor: start; fill: #5b707a" x="48.96" y="623.679492" transform="rotate(-0 48.96 623.679492)">α=0.5, T=1 · 교사 분포는 학습 손실에만 사용 · 학생 입력 채널에 정답이나 교사 확률을 붙이지 않음</text>
   </g>
   <g id="text_5">
